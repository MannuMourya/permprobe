[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permprobe"
version = "1.2.0"
description = "Non-destructive permission matrix for S3, GCS, Azure Blob, and HTTP resources."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Mannu Mourya" },
]
keywords = [
    "security",
    "bug-bounty",
    "s3",
    "gcs",
    "azure",
    "permissions",
    "recon",
    "cloud",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/mannumourya/permprobe"
Source = "https://github.com/mannumourya/permprobe"
Issues = "https://github.com/mannumourya/permprobe/issues"

[project.scripts]
permprobe = "permprobe.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["permprobe*"]
exclude = ["tests*", "artifacts*"]
